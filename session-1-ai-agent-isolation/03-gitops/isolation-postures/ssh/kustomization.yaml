# Postura `ssh` — dos namespaces, SSH como único ingreso, egress deny + DNS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: redteam-agents
      redteam.posture: ssh
    includeSelectors: false

resources:
  - namespace.yaml
  - gateway.yaml
  - sandbox.yaml
  - networkpolicy.yaml
  - secret-crosscompartment.yaml
