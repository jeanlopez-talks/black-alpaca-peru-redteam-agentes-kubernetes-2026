# Postura `bare` — línea base sin aislamiento.
# NO incluye networkpolicy.yaml a propósito: `bare` es el control negativo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: redteam-agents
      redteam.posture: bare
    includeSelectors: false

resources:
  - namespace.yaml
  - gateway.yaml
  - sandbox.yaml
  - secret-crosscompartment.yaml
