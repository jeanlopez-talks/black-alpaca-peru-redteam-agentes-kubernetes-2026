# Postura `bare-np` — línea base + NetworkPolicy como única frontera.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: redteam-agents
      redteam.posture: bare-np
    includeSelectors: false

resources:
  - namespace.yaml
  - gateway.yaml
  - sandbox.yaml
  - networkpolicy.yaml
  - secret-crosscompartment.yaml
