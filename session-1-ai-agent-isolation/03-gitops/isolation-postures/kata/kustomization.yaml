# Postura `kata` — microVM (runtimeClassName: kata), dos namespaces,
# egress deny + DNS. Requiere OpenShift Sandboxed Containers instalado
# (lo gestiona otra Application de Argo CD con sync-wave -1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: redteam-agents
      redteam.posture: kata
    includeSelectors: false

resources:
  - namespace.yaml
  - gateway.yaml
  - sandbox.yaml
  - networkpolicy.yaml
  - secret-crosscompartment.yaml
