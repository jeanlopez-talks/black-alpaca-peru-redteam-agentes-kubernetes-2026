# Configuración del LLM local del duelo (vLLM `qwen3-8b`, API OpenAI-compatible) dentro
# del clúster: sin egress a internet y sin secreto. vLLM no exige API key; el código usa
# "not-needed" por defecto, así que no hay ningún Secret que versionar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: duel-llm-config
  namespace: devsecops-duel
data:
  # openai-compatible -> ChatOpenAI con base_url custom (ver ../../../04-ai-agents/src/devsecops_agents/common/llm.py).
  LLM_PROVIDER: "openai-compatible"
  LLM_MODEL: "qwen3-8b"                 # served-model-name del vLLM
  OPENAI_BASE_URL: "http://vllm.inference.svc.cluster.local:8000/v1"
