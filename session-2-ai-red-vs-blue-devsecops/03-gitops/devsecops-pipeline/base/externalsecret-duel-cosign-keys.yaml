# Par de claves cosign del pipeline (etapas sign y verify), desde OpenBao. La clave
# privada nunca está en Git ni se crea a mano en el clúster. Se monta solo en los steps
# de firma/verificación; el runner del agente rojo no tiene RBAC para leer Secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: duel-cosign-keys
  namespace: devsecops-duel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-black-alpaca
    kind: SecretStore
  target:
    name: duel-cosign-keys
    creationPolicy: Owner
  data:
    - secretKey: cosign.key
      remoteRef:
        key: apps/black-alpaca/duel-cosign-keys
        property: cosign.key
    - secretKey: cosign.pub
      remoteRef:
        key: apps/black-alpaca/duel-cosign-keys
        property: cosign.pub
    - secretKey: cosign.password
      remoteRef:
        key: apps/black-alpaca/duel-cosign-keys
        property: cosign.password
