# Identidad de la etapa deploy-gitops: la credencial de despliegue que en el mundo real
# acaba teniendo el agente. Solo puede crear y modificar el Deployment de la app objetivo
# en este namespace (role-sample-app-deployer.yaml). Kyverno la rechaza igualmente: en
# devsecops-duel solo despliega Argo CD (duel-require-human-approval).
#
# Es la única identidad del pipeline con token de API, y solo la usa esa etapa
# (taskRunSpecs de los PipelineRun).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app-deployer
  namespace: devsecops-duel
