# Pull de la imagen privada de los agentes (ghcr.io/labjp-homelab/devsecops-agents), desde
# OpenBao por el SecretStore de este namespace. Es un token de solo lectura de paquetes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: devsecops-duel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-black-alpaca
    kind: SecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: apps/ghcr-pull
        property: .dockerconfigjson
