# NetworkPolicy del runner del duelo — VERSION KUBERNETES VANILLA (k3s).
#
# En k3s las NetworkPolicy funcionan igual que en cualquier Kubernetes (k3s trae
# un controlador de NetworkPolicy por defecto). Mismo patron que la version
# OpenShift, pero el egress del modo llm cambia: ya NO se abre HTTPS (443) a
# internet — el LLM es LOCAL (vLLM en el namespace `inference`, ClusterIP). El
# runner solo necesita llegar a ESE servicio interno, no salir del cluster.
#
# DOS FRONTERAS segun el modo (ver ../../../04-ai-agents/red-blue-agents/README.md):
#   - MODO rules (default): egress deny-by-default salvo DNS. El runner NO sale a
#     ningun sitio; los agentes deciden por reglas (sin LLM). Misma frontera que
#     la postura bare-np y la frontera 4 del Acto 4: el radio de explosion del
#     runner esta acotado.
#   - MODO llm: se AÑADE egress al LLM local (namespace inference, TCP 8000).
#     DIFERENCIA vs OpenShift (punto de charla): alli el modo llm abria egress a
#     INTERNET (API de un tercero) — nueva superficie de exfiltracion. Aqui el
#     modelo vive dentro del cluster: el egress que se abre es SOLO al servicio
#     interno vllm.inference.svc, NO a internet. El trade-off se reduce, no
#     desaparece (sigue siendo trafico este-oeste nuevo).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: devsecops-duel
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: devsecops-duel
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Egress al LLM LOCAL para el MODO llm: permite alcanzar el servicio vLLM en el
# namespace `inference` (puerto 8000, API OpenAI-compatible). NO abre internet.
# Si solo se usa el modo rules, este bloque puede eliminarse sin romper nada.
#
# NOTA: el selector del namespace destino usa la label estandar
# `kubernetes.io/metadata.name: inference` (auto-asignada por el API server a
# cada Namespace). Ajusta el namespace si el vLLM vive en otro.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-egress
  namespace: devsecops-duel
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inference
      ports:
        - protocol: TCP
          port: 8000
---
# Egress para las ETAPAS QUE SALEN A INTERNET legitimamente. Se permite HTTPS
# (443) SOLO a los pods de estas tasks (label que Tekton pone a cada pod), no a
# todos. El gate del agente azul (runtime del agente) queda igual: aislado salvo
# el pip del sidecar. Separar el egress del tooling del supply chain del runtime
# del agente es parte del blueprint de la charla.
#
# POR QUE cada task necesita egress:
#   - build      : kaniko pullea la imagen base del registry publico (443).
#   - sast       : pull de las imagenes semgrep/gitleaks + reglas de semgrep (p/ci,
#                  p/secrets) que se bajan de su registry (443).
#   - sbom       : pull de la imagen anchore/syft (443). Syft NO consulta red para
#                  analizar (lee el tar local), pero su imagen se pullea.
#   - trivy-scan : pull de aquasec/trivy + DESCARGA DE LA DB de vulnerabilidades
#                  (443). Es el egress imprescindible de Trivy; sin el, fallback
#                  documentado (status=SKIPPED).
#   - sign/verify: pull de la imagen cosign (443). La firma es con CLAVE y offline
#                  (--tlog-upload=false / --insecure-ignore-tlog): no contacta
#                  Rekor/Fulcio, pero la imagen de cosign si se pullea.
#   - gate-blue  : pip del sidecar (a2a-sdk/uvicorn) desde PyPI (443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-build-egress
  namespace: devsecops-duel
spec:
  podSelector:
    matchExpressions:
      - key: tekton.dev/pipelineTask
        operator: In
        values: ["build", "sast", "sbom", "trivy-scan", "sign", "verify", "gate-blue"]
  policyTypes:
    - Egress
  egress:
    # HTTPS a cualquier destino (pull de imágenes, reglas de semgrep, DB de Trivy).
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # DNS (resolver registries y endpoints de DB/reglas).
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Egress al REGISTRY INTERNO Zot (puerto 5000, namespace registry). Lo necesitan
# las tasks del supply chain que interactúan con el registry: build (push),
# sbom/trivy (pull para escanear), sign/verify (firmar/verificar la imagen).
# Es tráfico este-oeste interno (ClusterIP), no egress a internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-registry-egress
  namespace: devsecops-duel
  labels:
    app.kubernetes.io/part-of: black-alpaca-2026
    black-alpaca.session: ai-red-vs-blue-devsecops
spec:
  # Aplica a los pods de las tasks que tocan el registry.
  podSelector:
    matchExpressions:
      - key: tekton.dev/pipelineTask
        operator: In
        values: ["build", "sbom", "trivy-scan", "sign", "verify"]
  policyTypes:
    - Egress
  egress:
    # Al namespace del registry, puerto 5000 (Zot).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry
      ports:
        - protocol: TCP
          port: 5000
    # DNS para resolver zot.registry.svc.
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
