# NetworkPolicies del namespace del duelo: egress denegado por defecto y abierto solo lo
# imprescindible por etapa.
#
#   - Todas las etapas: DNS.
#   - build/sast/sbom/trivy-scan/sign/verify: HTTPS (pull de herramientas, DB de Trivy)
#     y el registry interno.
#   - gate-blue (agente rojo): SOLO el agente azul por A2A. Sin internet ni LLM.
#   - Agente azul: su propia política (../agents/networkpolicy-blue-reviewer.yaml): solo
#     DNS y el LLM local; solo acepta tráfico del rojo.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: devsecops-duel
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: devsecops-duel
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Egress al LLM LOCAL para el MODO llm: permite alcanzar el servicio vLLM en el
# namespace `inference` (puerto 8000, API OpenAI-compatible). NO abre internet.
# Si solo se usa el modo rules, este bloque puede eliminarse sin romper nada.
#
# NOTA: el selector del namespace destino usa la label estandar
# `kubernetes.io/metadata.name: inference` (auto-asignada por el API server a
# cada Namespace). Ajusta el namespace si el vLLM vive en otro.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gate-blue-to-reviewer
  namespace: devsecops-duel
spec:
  # El step del rojo SOLO puede hablar con el agente azul por A2A (ni internet ni LLM).
  podSelector:
    matchLabels:
      tekton.dev/pipelineTask: gate-blue
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blue-reviewer
      ports:
        - protocol: TCP
          port: 9999
---
# Egress para las ETAPAS QUE SALEN A INTERNET legitimamente. Se permite HTTPS
# (443) SOLO a los pods de estas tasks (label que Tekton pone a cada pod), no a
# todos. Los agentes (gate-blue y el azul) quedan fuera: sin internet. Separar el
# egress del tooling del supply chain del runtime de los agentes es parte del
# blueprint de la charla.
#
# POR QUE cada task necesita egress:
#   - build      : kaniko pullea la imagen base del registry publico (443).
#   - sast       : pull de las imagenes semgrep/gitleaks + reglas de semgrep (p/ci,
#                  p/secrets) que se bajan de su registry (443).
#   - sbom       : pull de la imagen anchore/syft (443). Syft NO consulta red para
#                  analizar (lee el tar local), pero su imagen se pullea.
#   - trivy-scan : pull de aquasec/trivy + DESCARGA DE LA DB de vulnerabilidades
#                  (443). Es el egress imprescindible de Trivy; sin el, fallback
#                  documentado (status=SKIPPED).
#   - sign/verify: pull de la imagen cosign (443). La firma es con CLAVE y offline
#                  (--tlog-upload=false / --insecure-ignore-tlog): no contacta
#                  Rekor/Fulcio, pero la imagen de cosign si se pullea.
#   (gate-blue NO está aquí: el rojo no tiene salida a internet.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-build-egress
  namespace: devsecops-duel
spec:
  podSelector:
    matchExpressions:
      - key: tekton.dev/pipelineTask
        operator: In
        values: ["build", "sast", "sbom", "trivy-scan", "sign", "verify"]
  policyTypes:
    - Egress
  egress:
    # HTTPS a cualquier destino (pull de imágenes, reglas de semgrep, DB de Trivy).
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # DNS (resolver registries y endpoints de DB/reglas).
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Egress al REGISTRY INTERNO Zot (puerto 5000, namespace registry). Lo necesitan
# las tasks del supply chain que interactúan con el registry: build (push),
# sbom/trivy (pull para escanear), sign/verify (firmar/verificar la imagen).
# Es tráfico este-oeste interno (ClusterIP), no egress a internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-registry-egress
  namespace: devsecops-duel
  labels:
    app.kubernetes.io/part-of: black-alpaca-2026
    black-alpaca.session: ai-red-vs-blue-devsecops
spec:
  # Aplica a los pods de las tasks que tocan el registry.
  podSelector:
    matchExpressions:
      - key: tekton.dev/pipelineTask
        operator: In
        values: ["build", "sbom", "trivy-scan", "sign", "verify"]
  policyTypes:
    - Egress
  egress:
    # Al namespace del registry, puerto 5000 (Zot).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry
      ports:
        - protocol: TCP
          port: 5000
    # DNS para resolver zot.registry.svc.
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Egress al API server SOLO para la etapa deploy-gitops (el intento de despliegue del
# agente con su credencial). La regla se evalúa tras el DNAT del Service `kubernetes`,
# así que el destino es el control plane (kube-master), no la ClusterIP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-deploy-to-apiserver
  namespace: devsecops-duel
spec:
  podSelector:
    matchLabels:
      tekton.dev/pipelineTask: deploy-gitops
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.10.41/32
      ports:
        - protocol: TCP
          port: 6443
