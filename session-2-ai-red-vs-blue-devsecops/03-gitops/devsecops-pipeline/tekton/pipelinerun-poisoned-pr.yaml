# PipelineRun del flujo DevSecOps completo (8 etapas) contra el PR ENVENENADO
# (Acto 2/3). Cambia pr-diff a pr-01-obvious.diff para el Acto 1 (el azul bloquea
# y deploy-gitops NO corre).
#
# name fijo + sync-options Replace=true: los PipelineRun son inmutables, asi que
# Argo CD lo reemplaza (borra+crea) en cada sync para re-ejecutar el duelo.
# Para disparar runs ad-hoc fuera de Argo CD:
#     kubectl create -f pipelinerun-poisoned-pr.yaml   (con generateName en vez de name).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: duel-devsecops-poisoned
  namespace: openclaw-duel
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  pipelineRef:
    name: duel-devsecops
  params:
    - name: pr-diff
      value: pr-02-poisoned.diff
    # rules (solo stdlib, sin egress, default) | llm (A2A + LLM LOCAL vLLM qwen3).
    - name: agent-mode
      value: rules
    # SAST (semgrep + gitleaks) INFORMATIVO por defecto: no bloquea el pipeline,
    # para que la demo del ataque fluya hasta el gate + la admision (la frontera
    # real). Ponlo en "true" para hacerlo bloqueante.
    - name: sast-blocking
      value: "false"
    # Politica de severidad de Trivy (etapa trivy-scan).
    - name: trivy-severity
      value: "HIGH,CRITICAL"
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          # RWX: las 8 tasks (sast, build, sbom, trivy, sign, gate, verify, deploy)
          # comparten el workspace sin forzar co-scheduling al mismo nodo
          # (coschedule=disabled en Tekton). Con local-path (RWO) la carrera
          # affinity-assistant + WaitForFirstConsumer mataba el init (code 137).
          accessModes:
            - ReadWriteMany
          # nfs-writable: storageClass con mountPermissions 0770 (owner+GRUPO, NO others).
          # Los pods pertenecen al grupo 1000 vía fsGroup:1000 (ver taskRunTemplate)
          # y pueden escribir el workspace SIN world-writable (0777 es una mala
          # práctica de seguridad que el propio pipeline audita — no la cometemos).
          storageClassName: nfs-writable
          resources:
            requests:
              storage: 1Gi
  taskRunTemplate:
    # El runner corre con un ServiceAccount sin permisos de merge ni de API: el
    # agente NO puede mergear ni desplegar por si solo (frontera del Acto 4).
    serviceAccountName: duel-runner
    # fsGroup 1000: el workspace NFS (RWX) se monta propiedad de root; sin esto,
    # los steps que corren como uid 1000 no pueden escribir en /workspace/shared
    # (Permission denied). fsGroup hace que el volumen sea escribible por el grupo.
    podTemplate:
      securityContext:
        fsGroup: 1000
