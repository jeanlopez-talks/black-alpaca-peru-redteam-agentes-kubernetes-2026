# Lo que sincroniza la Application ai-red-vs-blue-devsecops-sample-app (homelab-gitops,
# bootstrap/applications/talks/black-alpaca-2026). La fuente de la imagen (Containerfile +
# index.html) la consume la etapa build del pipeline, no este kustomize.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: black-alpaca-2026
      black-alpaca.session: ai-red-vs-blue-devsecops
    includeSelectors: false

resources:
  - deployment-sample-app.yaml
  - service-sample-app.yaml
