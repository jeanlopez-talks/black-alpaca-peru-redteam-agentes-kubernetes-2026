# Identidad del agente azul. Sin token de API: el revisor no habla con Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blue-reviewer
  namespace: devsecops-duel
automountServiceAccountToken: false
# La imagen de los agentes es privada en GHCR.
imagePullSecrets:
  - name: ghcr-pull
