# Sandbox de red del agente azul (ambas posturas): solo el paso del rojo (gate-blue) le
# habla por A2A, y él solo sale al DNS y al LLM local. Sin internet ni API de Kubernetes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blue-reviewer
  namespace: devsecops-duel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blue-reviewer
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tekton.dev/pipelineTask: gate-blue
      ports:
        - port: 9999
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inference
      ports:
        - port: 8000
          protocol: TCP
