# Pipeline DevSecOps del duelo rojo vs azul (8 etapas: sast -> build -> sbom ->
# trivy-scan -> sign -> gate-blue -> verify -> deploy-gitops). Ver README.md.
#
#   base/        ServiceAccount del runner, NetworkPolicies, config del LLM
#                (el namespace lo crea la Application de admission-policies, con Pod Security)
#   agents/      agente azul (vulnerable y endurecido) como servicio A2A en sandbox
#   tekton/      Pipeline + PipelineRun del PR envenenado (el rojo es un step)
#   sample-app/  la app objetivo (fuente de la imagen + manifiestos que despliega Argo CD)
#   fixtures/    entrada realista para la etapa SAST
#
# Fuera de este kustomize: las policies de Kyverno (../admission-policies/,
# Application propia). El código de los agentes va en su imagen (../../04-ai-agents/)
# y la clave cosign llega por ExternalSecret desde OpenBao.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sin esto los configMapGenerator caen en 'default' y el pipeline no los encuentra.
namespace: devsecops-duel

labels:
  - pairs:
      app.kubernetes.io/part-of: black-alpaca-2026
      black-alpaca.session: ai-red-vs-blue-devsecops
    includeSelectors: false

resources:
  - base/serviceaccount-duel-runner.yaml
  - base/serviceaccount-openbao-reader.yaml
  - base/secretstore-openbao.yaml
  - base/externalsecret-duel-cosign-keys.yaml
  - base/networkpolicies-egress.yaml
  - base/llm-config.yaml
  - agents/serviceaccount-blue-reviewer.yaml
  - agents/deployment-blue-reviewer.yaml
  - agents/service-blue-reviewer.yaml
  - agents/deployment-blue-reviewer-hardened.yaml
  - agents/service-blue-reviewer-hardened.yaml
  - agents/networkpolicy-blue-reviewer.yaml
  - tekton/pipeline-devsecops.yaml
  - tekton/pipelinerun-poisoned-pr.yaml

# ConfigMaps que el pipeline materializa en runtime, generados desde los mismos
# archivos versionados (una sola fuente de verdad).
configMapGenerator:
  - name: sample-app-src            # etapa build: fuente de la imagen
    files:
      - sample-app/Containerfile
      - sample-app/index.html
  - name: duel-argo-app-src         # etapa deploy-gitops: la Application de Argo CD
    files:
      - sample-app/application-sample-app.yaml
  - name: duel-sast-input           # etapa sast: el config del PR envenenado
    files:
      - fixtures/deploy-notes.md

# Nombres estables (sin hash) para que el pipeline los referencie por nombre fijo.
generatorOptions:
  disableNameSuffixHash: true
