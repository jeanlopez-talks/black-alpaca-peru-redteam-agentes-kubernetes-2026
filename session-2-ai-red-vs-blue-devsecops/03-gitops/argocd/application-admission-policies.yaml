# Policies de admisión del duelo (Kyverno, namespaced). Es la Application dueña del
# namespace devsecops-duel: lo crea con Pod Security para que las policies existan
# antes que cualquier pod. El motor Kyverno es plataforma (repo del homelab).
#
# Pod Security: `baseline` en enforce porque kaniko construye como root con
# capabilities mínimas (todas dentro de baseline); `restricted` en audit/warn para que
# cualquier otra desviación quede registrada.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-red-vs-blue-devsecops-admission-policies
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: black-alpaca-2026
    black-alpaca.session: ai-red-vs-blue-devsecops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-red-vs-blue-devsecops
  source:
    repoURL: https://github.com/jeanlopez-talks/black-alpaca-peru-redteam-agentes-kubernetes-2026.git
    targetRevision: main
    path: session-2-ai-red-vs-blue-devsecops/03-gitops/admission-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-duel
  syncPolicy:
    # Los controles de seguridad no pueden derivar: se revierte cualquier cambio manual.
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: black-alpaca-2026
        black-alpaca.session: ai-red-vs-blue-devsecops
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
