# Agente DevSecOps (human-in-the-loop) que consume Backstage. Vive en su propio
# namespace, devsecops-agent, separado del pipeline donde corre el agente rojo: aquí
# están las credenciales (token humano y token de Argo CD), allí la carga no confiable.
# El portal Backstage es plataforma del homelab.
#
# Pod Security `restricted`: el agente no necesita ningún privilegio.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-red-vs-blue-devsecops-backstage-agent
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: black-alpaca-2026
    black-alpaca.session: ai-red-vs-blue-devsecops
  annotations:
    # Su Role de lectura vive en devsecops-duel, que crea admission-policies (-1).
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-red-vs-blue-devsecops
  source:
    repoURL: https://github.com/jeanlopez-talks/black-alpaca-peru-redteam-agentes-kubernetes-2026.git
    targetRevision: main
    path: session-2-ai-red-vs-blue-devsecops/03-gitops/backstage/devsecops-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: black-alpaca-2026
        black-alpaca.session: ai-red-vs-blue-devsecops
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
