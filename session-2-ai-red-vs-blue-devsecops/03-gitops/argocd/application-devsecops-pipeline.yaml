# Application de Argo CD que despliega el PIPELINE del duelo (propuesta 2):
# pipeline Tekton de 8 etapas + supply chain + sample-app. Kyverno (admission)
# se gestiona por su propia Application (application-kyverno.yaml) porque sus
# ClusterPolicy son cluster-scoped.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-red-vs-blue-devsecops-pipeline
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: black-alpaca-2026
    black-alpaca.session: ai-red-vs-blue-devsecops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-red-vs-blue-devsecops
  source:
    repoURL: https://github.com/jeanlopez-talks/black-alpaca-peru-redteam-agentes-kubernetes-2026.git
    targetRevision: main
    path: session-2-ai-red-vs-blue-devsecops/03-gitops/devsecops-pipeline
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-duel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
