# Pipeline Tekton de 8 etapas del duelo. Corre en devsecops-duel, que crea (con Pod
# Security) la Application de admission-policies.
#
# Sync MANUAL a propósito: sincronizar lanza el PipelineRun, es decir, la demo del
# ataque. Se ejecuta cuando alguien lo decide, no en cada commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-red-vs-blue-devsecops-pipeline
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: black-alpaca-2026
    black-alpaca.session: ai-red-vs-blue-devsecops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-red-vs-blue-devsecops
  source:
    repoURL: https://github.com/jeanlopez-talks/black-alpaca-peru-redteam-agentes-kubernetes-2026.git
    targetRevision: main
    path: session-2-ai-red-vs-blue-devsecops/03-gitops/devsecops-pipeline
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-duel
  syncPolicy:
    retry:
      limit: 3
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
