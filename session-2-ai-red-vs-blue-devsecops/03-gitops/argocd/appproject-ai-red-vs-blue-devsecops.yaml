# AppProject de Argo CD para la PROPUESTA 2 (duelo rojo vs azul + supply chain + Backstage).
# Clúster k3s vanilla; Argo CD vive en el namespace `argocd` (NO openshift-gitops).
# Proyecto SEPARADO del de la propuesta 1 (ai-agent-isolation).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-red-vs-blue-devsecops
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: black-alpaca-2026
    black-alpaca.session: ai-red-vs-blue-devsecops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: >-
    Propuesta 2 de Black Alpaca 2026: flujo DevSecOps del duelo de agentes de IA
    (pipeline Tekton de 8 etapas con supply chain) + portal Backstage + agente
    interactivo. Todo gestionado por GitOps en un clúster k3s.

  # Repo de la charla.
  sourceRepos:
    - https://github.com/jeanlopez-talks/black-alpaca-peru-redteam-agentes-kubernetes-2026.git

  # Namespaces destino de esta propuesta.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: openclaw-duel      # pipeline del duelo + supply chain
    - server: https://kubernetes.default.svc
      namespace: backstage          # portal + agente interactivo
    - server: https://kubernetes.default.svc
      namespace: kyverno            # admission control (si se gestiona por esta app)

  # Recursos de ámbito de clúster que las Applications pueden crear.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # Kyverno ClusterPolicy (admission control del supply chain).
    - group: kyverno.io
      kind: ClusterPolicy
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

  # Recursos namespaced: "*" dentro de los namespaces ya acotados por destinations.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
