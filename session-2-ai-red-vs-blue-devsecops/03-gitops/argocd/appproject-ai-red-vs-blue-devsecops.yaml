# AppProject de la PROPUESTA 2 (duelo rojo vs azul en el pipeline DevSecOps).
#
# Mínimo privilegio, porque quien escribe en el repo de la charla controla lo que se
# despliega:
#   - un único repo de origen;
#   - solo dos namespaces, separados a propósito: devsecops-duel (pipeline y agente rojo,
#     carga NO confiable, sin credenciales) y devsecops-agent (agente con tokens);
#   - ámbito de clúster: solo esos dos Namespace, por nombre. Nada de ClusterRole,
#     ClusterRoleBinding, CRD ni policies de clúster (las de Kyverno son namespaced);
#   - lista explícita de tipos namespaced: sin Secret (los secretos llegan por
#     ExternalSecret desde un SecretStore acotado).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-red-vs-blue-devsecops
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: black-alpaca-2026
    black-alpaca.session: ai-red-vs-blue-devsecops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: >-
    Propuesta 2 de Black Alpaca 2026: pipeline DevSecOps de 8 etapas con supply chain,
    admisión Kyverno y el agente human-in-the-loop de Backstage.

  sourceRepos:
    - https://github.com/jeanlopez-talks/black-alpaca-peru-redteam-agentes-kubernetes-2026.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: devsecops-duel
    - server: https://kubernetes.default.svc
      namespace: devsecops-agent

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: devsecops-duel
    - group: ""
      kind: Namespace
      name: devsecops-agent

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: tekton.dev
      kind: Pipeline
    - group: tekton.dev
      kind: PipelineRun
    - group: policies.kyverno.io
      kind: NamespacedValidatingPolicy
    - group: policies.kyverno.io
      kind: NamespacedImageValidatingPolicy
    - group: external-secrets.io
      kind: SecretStore
    - group: external-secrets.io
      kind: ExternalSecret

  # Avisa si aparecen en estos namespaces recursos que no vienen de Git (deriva o
  # algo creado a mano).
  orphanedResources:
    warn: true

  # Rol de solo lectura para el agente DevSecOps: lee el estado de las Application de
  # ESTE proyecto por la API de Argo CD, sin RBAC de Kubernetes en el namespace argocd.
  # Su token se emite con `argocd proj role create-token` y se guarda en OpenBao.
  roles:
    - name: backstage-devsecops-agent-read
      description: Solo lectura de las Application del proyecto (agente DevSecOps)
      policies:
        - p, proj:ai-red-vs-blue-devsecops:backstage-devsecops-agent-read, applications, get, ai-red-vs-blue-devsecops/*, allow
