# Exposicion de Backstage via LoadBalancer (MetalLB).
#
# POR QUE LoadBalancer y no HTTPRoute: es la via mas directa y robusta para la
# demo en k3s vanilla. MetalLB tiene un pool 10.0.10.60-79; se pide una IP libre
# (10.0.10.66) con la annotation estandar de MetalLB. Si se prefiere Envoy
# Gateway, se puede sustituir este Service por un HTTPRoute (ver README.md,
# alternativa documentada); se deja LoadBalancer por simplicidad de la demo.
#
# URL del portal (documentada en README.md):  http://10.0.10.66
apiVersion: v1
kind: Service
metadata:
  name: backstage-lb
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.component: backstage
    app: backstage
  annotations:
    # AJUSTAR si 10.0.10.66 ya esta usada: elige otra libre del pool 10.0.10.60-79.
    metallb.universe.tf/loadBalancerIPs: "10.0.10.66"
spec:
  type: LoadBalancer
  selector:
    app: backstage
  ports:
    - name: http
      port: 80
      targetPort: 7007
      protocol: TCP
