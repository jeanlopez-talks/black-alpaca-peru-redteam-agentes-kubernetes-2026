# Secret con el TOKEN HUMANO de aprobacion del agente.
#
# Es el secreto que /approve exige en el header X-Human-Approval para EJECUTAR
# una propuesta. Modela el human-in-the-loop: solo quien tiene este token (un
# humano con permiso) puede confirmar una accion; el agente nunca lo conoce para
# "aprobarse a si mismo" — lo valida, no lo genera.
#
# PLACEHOLDER DE DEMO (no es un secreto real). Para un valor real, copia este
# archivo a `secret-human-token-secret.local.yaml` (ignorado por .gitignore:
# `*-secret.local.yaml`), pon ahi un token aleatorio (openssl rand -hex 16) y
# aplica ESE, no el versionado. Nunca hardcodear secretos reales en git.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-agent-human-token
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.component: backstage-agent
type: Opaque
stringData:
  # AJUSTAR: token humano de aprobacion. Quien lo tenga puede confirmar acciones.
  HUMAN_APPROVAL_TOKEN: "CHANGE-ME-demo-human-token"
