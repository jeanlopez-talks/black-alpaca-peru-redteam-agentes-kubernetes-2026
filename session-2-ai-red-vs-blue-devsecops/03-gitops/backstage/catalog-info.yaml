# Catálogo de Backstage de la charla. El portal (plataforma del homelab) lo registra como
# Location apuntando a este archivo en el repo. Las anotaciones conectan cada plugin:
#   argocd/app-name              -> pestaña Argo CD (en el System: argocd/app-selector)
#   backstage.io/techdocs-ref    -> pestaña TechDocs (mkdocs.yml + docs/)
#   tekton.dev/cicd + k8s-id     -> pestaña Tekton (PipelineRun/TaskRun)
#   backstage.io/kubernetes-id   -> plugin Kubernetes: busca los recursos con la etiqueta
#                                   `backstage.io/kubernetes-id: <valor>` (la llevan los
#                                   PipelineRun, que Tekton propaga a TaskRun y pods, y los
#                                   pods de cada agente)
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ai-red-vs-blue-devsecops
  title: Agentes de IA en DevSecOps (agente rojo vs agente azul)
  annotations:
    # Pestaña ArgoCD: todas las Applications de la demo (clave sin "/": el plugin la
    # pone en la URL y con "/" no encuentra la ruta).
    argocd/app-selector: black-alpaca.session=ai-red-vs-blue-devsecops
    # Pestaña TechDocs: mkdocs.yml y docs/ junto a este archivo.
    backstage.io/techdocs-ref: dir:.
  description: >-
    Un agente rojo intenta colar un PR malicioso y un agente azul lo revisa dentro de un
    pipeline DevSecOps: Tekton de 9 etapas, admisión Kyverno y
    despliegue GitOps por Argo CD. Dos agentes con la persona en el bucle: el de
    aprobación resume y propone acciones; el de remediación explica los hallazgos con
    sus lineamientos y solo aplica una corrección cuando la confirmas.
  tags: [redteam, devsecops, black-alpaca-2026]
spec:
  owner: labjp-homelab
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: devsecops-pipeline
  title: Pipeline DevSecOps (SAST, build, Trivy, firma, revisión IA, despliegue)
  description: >-
    Pipeline Tekton 'devsecops-pipeline': SAST, build, SBOM, Trivy,
    firma, gate del agente azul, verificación y deploy GitOps. Kyverno frena el
    deploy sin aprobación humana.
  annotations:
    argocd/app-name: ai-red-vs-blue-devsecops-sample-app
    tekton.dev/cicd: "true"
    backstage.io/kubernetes-id: devsecops-pipeline
    backstage.io/kubernetes-namespace: devsecops-duel
  tags: [tekton, kyverno, supply-chain]
spec:
  type: service
  lifecycle: experimental
  owner: labjp-homelab
  system: ai-red-vs-blue-devsecops
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: approval-agent
  title: Agente de aprobación (resume el pipeline, propone y espera al humano)
  description: >-
    Resume cada etapa del pipeline, explica por qué se aprobó o rechazó y PROPONE
    acciones que un humano confirma con su token. Propone, pero no actúa solo.
  annotations:
    backstage.io/kubernetes-id: backstage-devsecops-agent
    backstage.io/kubernetes-namespace: devsecops-agent
  tags: [agent, human-in-the-loop, langgraph]
spec:
  type: service
  lifecycle: experimental
  owner: labjp-homelab
  system: ai-red-vs-blue-devsecops
  providesApis: [approval-agent-api]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: approval-agent-api
  title: API A2A del agente de aprobación
  description: >-
    Agente A2A con tres skills: summarize-pipeline (lectura), propose-actions (no
    ejecuta) y execute-action (exige el token de un humano en la cabecera X-Human-Approval).
  links:
    - url: http://backstage-devsecops-agent.devsecops-agent.svc.cluster.local/.well-known/agent-card.json
      title: AgentCard
spec:
  type: a2a
  lifecycle: experimental
  owner: labjp-homelab
  system: ai-red-vs-blue-devsecops
  definition: |
    protocol: A2A (JSON-RPC 2.0)
    agentCard: /.well-known/agent-card.json
    skills:
      summarize-pipeline: '{"skill": "summarize-pipeline"}'
      propose-actions: '{"skill": "propose-actions"}'
      execute-action: '{"skill": "execute-action", "action_id": "approve:<run>"}  # cabecera X-Human-Approval: <token humano>'
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: remediation-agent
  title: Agente de remediación (explica hallazgos y propone correcciones)
  description: >-
    Convierte los hallazgos de Trivy en recomendaciones con su lineamiento (leído por MCP
    y contrastado con la política que Kyverno aplica), conversa en Backstage y solo sube
    una corrección a una rama remediation/* cuando la persona la confirma.
  annotations:
    backstage.io/kubernetes-id: devsecops-remediation-agent
    backstage.io/kubernetes-namespace: devsecops-agent
  tags: [agent, human-in-the-loop, mcp, a2a]
spec:
  type: service
  lifecycle: experimental
  owner: labjp-homelab
  system: ai-red-vs-blue-devsecops
  providesApis: [remediation-agent-api]
  consumesApis: []
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: remediation-agent-api
  title: API A2A del agente de remediación
  description: >-
    Dos puertas separadas por NetworkPolicy: advise (:8081, solo la etapa remediation
    del pipeline) y chat/latest-report/confirm-action/cancel-action (:80, solo Backstage).
    confirm-action es la única forma de aplicar un cambio (botón de la persona).
  links:
    - url: http://devsecops-remediation-agent.devsecops-agent.svc.cluster.local/.well-known/agent-card.json
      title: AgentCard (puerta de Backstage)
spec:
  type: a2a
  lifecycle: experimental
  owner: labjp-homelab
  system: ai-red-vs-blue-devsecops
  definition: |
    protocol: A2A (JSON-RPC 2.0)
    agentCard: /.well-known/agent-card.json
    puertas:
      pipeline (:8081):
        advise: '{"skill": "advise", "pipeline_run": "...", "trivy": [...], "containerfile": "...", "containerfile_path": "..."}'
      backstage (:80):
        latest-report: '{"skill": "latest-report"}'
        chat: '{"skill": "chat", "message": "aplica R1"}  # prepara una acción pendiente; no aplica'
        confirm-action: '{"skill": "confirm-action", "action_id": "<id>"}  # botón Confirmar; misma conversación, 15 min'
        cancel-action: '{"skill": "cancel-action", "action_id": "<id>"}'
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: blue-reviewer
  title: Agente azul (revisa cada PR dentro del pipeline)
  description: Servidor A2A (skill review-pr) en sandbox; versión vulnerable y endurecida.
  annotations:
    backstage.io/kubernetes-id: blue-reviewer
    backstage.io/kubernetes-namespace: devsecops-duel
  tags: [agent, a2a, code-review]
spec:
  type: service
  lifecycle: experimental
  owner: labjp-homelab
  system: ai-red-vs-blue-devsecops
