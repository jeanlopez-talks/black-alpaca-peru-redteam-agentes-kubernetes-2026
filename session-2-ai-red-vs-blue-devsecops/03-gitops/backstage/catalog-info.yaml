# Catálogo de Backstage de la charla. El portal (plataforma del homelab) lo registra como
# Location apuntando a este archivo en el repo. Las anotaciones conectan cada plugin:
#   argocd/app-name              -> pestaña Argo CD
#   tekton.dev/cicd + k8s-id     -> pestaña Tekton (PipelineRun/TaskRun)
#   backstage.io/kubernetes-id   -> plugin Kubernetes: busca los recursos con la etiqueta
#                                   `backstage.io/kubernetes-id: <valor>` (la llevan los
#                                   PipelineRun, que Tekton propaga a TaskRun y pods, y los
#                                   pods de cada agente)
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: duel-devsecops
  title: Duelo DevSecOps (rojo vs azul)
  description: >-
    Flujo DevSecOps del duelo: pipeline Tekton de 8 etapas, admisión Kyverno y
    despliegue GitOps por Argo CD. El agente human-in-the-loop resume y propone
    acciones sobre este sistema.
  tags: [redteam, devsecops, black-alpaca-2026]
spec:
  owner: labjp-homelab
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: duel-pipeline
  title: Pipeline DevSecOps del duelo
  description: >-
    Pipeline Tekton 'duel-devsecops' en devsecops-duel: SAST, build, SBOM, Trivy,
    firma, gate del agente azul, verificación y deploy GitOps. Kyverno frena el
    deploy sin aprobación humana.
  annotations:
    argocd/app-name: ai-red-vs-blue-devsecops-sample-app
    tekton.dev/cicd: "true"
    backstage.io/kubernetes-id: duel-pipeline
    backstage.io/kubernetes-namespace: devsecops-duel
  tags: [tekton, kyverno, supply-chain]
spec:
  type: service
  lifecycle: experimental
  owner: labjp-homelab
  system: duel-devsecops
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage-devsecops-agent
  title: Agente DevSecOps (human-in-the-loop)
  description: >-
    Resume cada etapa del pipeline, explica por qué se aprobó o rechazó y PROPONE
    acciones que un humano confirma con su token. Propone, pero no actúa solo.
  annotations:
    backstage.io/kubernetes-id: backstage-devsecops-agent
    backstage.io/kubernetes-namespace: devsecops-agent
  tags: [agent, human-in-the-loop, langgraph]
spec:
  type: service
  lifecycle: experimental
  owner: labjp-homelab
  system: duel-devsecops
  providesApis: [devsecops-agent-api]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: devsecops-agent-api
  title: DevSecOps Approval Agent (A2A)
  description: >-
    Agente A2A con tres skills: summarize-pipeline (lectura), propose-actions (no
    ejecuta) y execute-action (exige el token de un humano en la cabecera X-Human-Approval).
  links:
    - url: http://backstage-devsecops-agent.devsecops-agent.svc.cluster.local/.well-known/agent-card.json
      title: AgentCard
spec:
  type: a2a
  lifecycle: experimental
  owner: labjp-homelab
  system: duel-devsecops
  definition: |
    protocol: A2A (JSON-RPC 2.0)
    agentCard: /.well-known/agent-card.json
    skills:
      summarize-pipeline: '{"skill": "summarize-pipeline"}'
      propose-actions: '{"skill": "propose-actions"}'
      execute-action: '{"skill": "execute-action", "action_id": "approve:<run>"}  # cabecera X-Human-Approval: <token humano>'
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: blue-reviewer
  title: Agente azul (revisor de PRs)
  description: Servidor A2A (skill review-pr) en sandbox; versión vulnerable y endurecida.
  annotations:
    backstage.io/kubernetes-id: blue-reviewer
    backstage.io/kubernetes-namespace: devsecops-duel
  tags: [agent, a2a, code-review]
spec:
  type: service
  lifecycle: experimental
  owner: labjp-homelab
  system: duel-devsecops
