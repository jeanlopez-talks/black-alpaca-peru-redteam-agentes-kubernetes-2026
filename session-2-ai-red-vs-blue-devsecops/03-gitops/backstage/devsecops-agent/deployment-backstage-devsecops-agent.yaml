# Agente DevSecOps (human-in-the-loop) que consume Backstage.
#
# Servidor A2A (skills summarize-pipeline, propose-actions, execute-action) con la imagen
# común de los agentes (../../../04-ai-agents/Containerfile), entrypoint `approval-agent`.
# Raíz de solo lectura; /tmp en un emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-devsecops-agent
  namespace: devsecops-agent
  labels:
    app: backstage-devsecops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-devsecops-agent
  template:
    metadata:
      labels:
        app: backstage-devsecops-agent
        # Lo usa el plugin Kubernetes de Backstage (catalog-info.yaml).
        backstage.io/kubernetes-id: backstage-devsecops-agent
    spec:
      serviceAccountName: backstage-devsecops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/labjp-homelab/devsecops-agents:0.1.2
          command: ["approval-agent"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: PUBLIC_URL
              value: http://backstage-devsecops-agent.devsecops-agent.svc.cluster.local/
            - name: PYTHONDONTWRITEBYTECODE # raíz de solo lectura
              value: "1"
            - name: DUEL_NAMESPACE
              value: devsecops-duel
            - name: ARGOCD_PROJECT
              value: ai-red-vs-blue-devsecops
            - name: LLM_PROVIDER
              value: openai-compatible
            - name: LLM_MODEL
              value: qwen3-8b
            - name: OPENAI_BASE_URL
              value: http://vllm.inference.svc.cluster.local:8000/v1
          envFrom:
            - secretRef:
                name: backstage-devsecops-agent # ExternalSecret (OpenBao)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # exec en lugar de httpGet: la NetworkPolicy de entrada no se abre al kubelet.
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
