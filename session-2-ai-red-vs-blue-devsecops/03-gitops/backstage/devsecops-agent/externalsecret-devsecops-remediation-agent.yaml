# Credenciales del agente de remediación, desde OpenBao por el SecretStore de la demo
# (acotado a apps/black-alpaca/*):
#   devsecops-remediation-agent      secreto de su cliente de Keycloak: con él obtiene el
#                                    JWT para leer lineamientos por agentgateway (MCP)
#   devsecops-remediation-agent-git  deploy key con escritura SOLO en el repo de la charla,
#                                    para subir ramas remediation/* (main está protegida)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devsecops-remediation-agent
  namespace: devsecops-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-black-alpaca
    kind: SecretStore
  target:
    name: devsecops-remediation-agent
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/black-alpaca/remediation-agent-oidc
        property: client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devsecops-remediation-agent-git
  namespace: devsecops-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-black-alpaca
    kind: SecretStore
  target:
    name: devsecops-remediation-agent-git
    creationPolicy: Owner
  data:
    - secretKey: ssh-privatekey
      remoteRef:
        key: apps/black-alpaca/remediation-agent-git
        property: ssh-privatekey
