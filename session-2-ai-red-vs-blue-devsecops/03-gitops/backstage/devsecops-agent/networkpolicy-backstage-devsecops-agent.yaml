# Mínimo privilegio de red para el agente: solo Backstage le habla, y él solo habla
# con el DNS, el API server (lectura de PipelineRun), la API de Argo CD (token de
# proyecto) y el LLM local.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backstage-devsecops-agent
  namespace: devsecops-agent
spec:
  podSelector:
    matchLabels:
      app: backstage-devsecops-agent
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backstage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: backstage
              app.kubernetes.io/component: backstage
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values: [kube-dns, coredns]
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # API server: la regla se evalúa tras el DNAT del Service `kubernetes`.
    - to:
        - ipBlock:
            cidr: 10.0.10.41/32
      ports:
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-server
      ports:
        - port: 8080
          protocol: TCP
    # MCP de Backstage por agentgateway (lineamientos del catálogo).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: agentgateway-proxy
      ports:
        - port: 80
          protocol: TCP
    # Keycloak (token client_credentials) por el Gateway interno.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: interno
      ports:
        - port: 10443
          protocol: TCP
    # LLM local. La plataforma también debe admitirlo en el ingress de `inference`
    # (hoy solo entran agentgateway, kagent, kserve y gastos).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inference
      ports:
        - port: 8000
          protocol: TCP
