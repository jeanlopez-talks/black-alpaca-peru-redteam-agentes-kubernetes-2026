# Secretos del agente desde OpenBao, por el SecretStore propio de este namespace
# (secretstore-openbao.yaml), que SOLO puede leer apps/black-alpaca/*. No usa el
# ClusterSecretStore global del homelab. Los valores se siembran en OpenBao (../README.md):
#   human-approval-token : token que /approve exige a un humano
#   argocd-token         : token del rol de proyecto `backstage-devsecops-agent-read`
#                          (solo lectura de las Application de ai-red-vs-blue-devsecops)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-devsecops-agent
  namespace: devsecops-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-black-alpaca
    kind: SecretStore
  target:
    name: backstage-devsecops-agent
    creationPolicy: Owner
  data:
    - secretKey: HUMAN_APPROVAL_TOKEN
      remoteRef:
        key: apps/black-alpaca/backstage-devsecops-agent
        property: human-approval-token
    - secretKey: ARGOCD_TOKEN
      remoteRef:
        key: apps/black-alpaca/backstage-devsecops-agent
        property: argocd-token
    # Su propio cliente de Keycloak para leer lineamientos por MCP (lo genera Ansible).
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/black-alpaca/approval-agent-oidc
        property: client-secret
