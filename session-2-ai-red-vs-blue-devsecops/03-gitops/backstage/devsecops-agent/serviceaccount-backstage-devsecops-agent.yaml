# Identidad del agente. Solo lectura: lee los PipelineRun del duelo (Role en
# devsecops-duel) y las Application de su proyecto por la API de Argo CD (token de
# rol de proyecto). No tiene permisos de escritura: la acción real la confirma y
# ejecuta un humano con sus propias credenciales.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-devsecops-agent
  namespace: devsecops-agent
