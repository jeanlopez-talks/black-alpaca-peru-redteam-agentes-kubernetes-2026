# Lectura de PipelineRun y TaskRun del duelo (estado por etapa), acotada a su namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-devsecops-agent-read-pipelineruns
  namespace: devsecops-duel
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, taskruns]
    verbs: [get, list, watch]
