# Identidad del agente de remediación en el clúster. No habla con la API de Kubernetes:
# sin token montado.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsecops-remediation-agent
  namespace: devsecops-agent
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull # imagen privada en GHCR (ExternalSecret ghcr-pull)
