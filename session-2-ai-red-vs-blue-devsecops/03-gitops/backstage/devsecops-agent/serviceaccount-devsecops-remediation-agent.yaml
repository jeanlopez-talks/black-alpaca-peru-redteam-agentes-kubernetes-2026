# Identidad del agente de remediación en el clúster. Su único permiso en la API es leer
# (get) las tres ValidatingPolicy de Kyverno que explica, para contrastarlas con el
# catálogo (Acto 5); el ClusterRole lo declara la plataforma (homelab-gitops,
# components/governance/rbac-black-alpaca.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsecops-remediation-agent
  namespace: devsecops-agent
imagePullSecrets:
  - name: ghcr-pull # imagen privada en GHCR (ExternalSecret ghcr-pull)
