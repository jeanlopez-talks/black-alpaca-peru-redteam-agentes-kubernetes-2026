# Dos puertos, una por puerta: Backstage habla con :80 (chat) y el pipeline con :8081
# (advise). La NetworkPolicy decide quién llega a cuál.
apiVersion: v1
kind: Service
metadata:
  name: devsecops-remediation-agent
  namespace: devsecops-agent
spec:
  selector:
    app: devsecops-remediation-agent
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: advise
      port: 8081
      targetPort: advise
      protocol: TCP
