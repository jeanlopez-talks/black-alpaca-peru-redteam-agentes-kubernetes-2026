# SecretStore namespaced de la charla. Mínimo privilegio frente al ClusterSecretStore
# global: se autentica con su propia ServiceAccount y el rol de OpenBao
# `black-alpaca-duel-agent`, cuya política solo permite LEER apps/black-alpaca/*.
# Prerrequisito de plataforma (OpenBao): ver ../README.md, "Secretos".
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-black-alpaca
  namespace: devsecops-agent
spec:
  provider:
    vault:
      server: https://10.0.10.20:8200
      path: homelab
      version: v2
      # CA del laboratorio que firma el certificado de OpenBao (público).
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: black-alpaca-duel-agent
          serviceAccountRef:
            name: openbao-reader
