# Policies de admisión del duelo (Kyverno, API CEL policies.kyverno.io/v1).
# Son namespaced: solo aplican en devsecops-duel. Las despliega la Application
# `ai-red-vs-blue-devsecops-admission-policies`, que además crea el namespace con
# Pod Security (las policies existen antes que cualquier pod).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devsecops-duel

labels:
  - pairs:
      app.kubernetes.io/part-of: black-alpaca-2026
      black-alpaca.session: ai-red-vs-blue-devsecops
    includeSelectors: false

resources:
  - namespacedvalidatingpolicy-require-human-approval.yaml
  - namespacedimagevalidatingpolicy-verify-images.yaml
