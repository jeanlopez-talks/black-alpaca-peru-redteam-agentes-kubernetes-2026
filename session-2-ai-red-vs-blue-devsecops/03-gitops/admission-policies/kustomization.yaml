# Kustomize de las policies Kyverno (admission control) del flujo DevSecOps.
# Son ClusterPolicy (cluster-scoped); las despliega la Application
# `ai-red-vs-blue-devsecops-admission-policies` de Argo CD.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: black-alpaca-2026
      black-alpaca.session: ai-red-vs-blue-devsecops
    includeSelectors: false

resources:
  # Frena el ataque: exige aprobación humana que el agente no puede dar (Enforce).
  - clusterpolicy-require-human-approval.yaml
  # Verificación de firma cosign de las imágenes propias de Zot (Enforce).
  - clusterpolicy-verify-images.yaml
