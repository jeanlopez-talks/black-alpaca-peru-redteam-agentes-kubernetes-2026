# ClusterPolicy Kyverno — LA CAPA DE ADMISION QUE FRENA EL ATAQUE.
#
# ANGULO "defensa en capas / que lo habria parado": el agente azul (gate del
# pipeline) APRUEBA el PR envenenado, pero esta policy RECHAZA el Deployment en
# admision porque le falta la anotacion de aprobacion-humana. El ataque que el
# agente dejo pasar lo para la policy.
#
# POR QUE funciona como frontera real:
#   - el agente (duel-runner) NO puede poner esta anotacion: su ServiceAccount no
#     tiene token de API (automountServiceAccountToken:false) ni RoleBinding, asi
#     que no puede mutar manifiestos ni hablar con el API server (ver
#     ../devsecops-pipeline/base/serviceaccount-duel-runner.yaml). Solo un HUMANO (o una SA con permisos explicitos) la
#     añade al manifiesto del repo tras una revision real.
#   - Argo CD aplica el Deployment del repo; si no lleva la anotacion, el webhook
#     de Kyverno lo rechaza ANTES de que se cree el pod.
#
# MODO Enforce: rechaza de verdad (es el punto de la demo). Para solo auditar,
# cambia validationFailureAction a Audit.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: duel-require-human-approval
  annotations:
    policies.kyverno.io/title: Exigir aprobacion humana en openclaw-duel
    policies.kyverno.io/category: Supply Chain / Admission Control
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Exige la anotacion duel.redteam/human-approved=true en los Deployment del
      namespace openclaw-duel. Modela el human-in-the-loop: el agente no puede
      ponerla (no tiene RBAC de API), solo un humano. Frena el deploy del PR
      envenenado aunque el gate del agente azul lo haya aprobado.
spec:
  # Enforce: el webhook RECHAZA la creacion/actualizacion que no cumpla.
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-human-approved-annotation
      match:
        any:
          - resources:
              kinds:
                - Deployment
              namespaces:
                - openclaw-duel
      validate:
        message: >-
          RECHAZADO POR ADMISION (Kyverno): este Deployment no tiene la anotacion
          'duel.redteam/human-approved: "true"'. El gate del agente azul puede
          haber aprobado el PR, pero el deploy exige aprobacion HUMANA real. El
          agente no puede poner esta anotacion (no tiene RBAC de API). Defensa en
          capas: la firma no detecto el ataque (solo toca config, no la imagen);
          la policy de admision SI.
        pattern:
          metadata:
            annotations:
              # El valor DEBE ser exactamente "true". El PR envenenado del duelo
              # NO trae esta anotacion -> Kyverno rechaza el Deployment.
              duel.redteam/human-approved: "true"
