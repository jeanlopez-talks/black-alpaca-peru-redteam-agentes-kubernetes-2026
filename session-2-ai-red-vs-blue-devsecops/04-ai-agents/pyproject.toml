[project]
name = "devsecops-agents"
version = "0.3.0"
description = "Agentes del duelo rojo vs azul (Black Alpaca 2026): revisor azul, atacante rojo, agente de aprobación humana y agente de remediación, comunicados por A2A."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jean Paul Lopez" }]
dependencies = [
  "a2a-sdk[http-server]>=1.2.1,<1.3",
  "httpx>=0.28,<1",
  "uvicorn>=0.54,<1",
  "langchain>=1.4,<2",
  "langgraph>=1.2,<2",
  "langchain-openai>=1.6,<2",
  "kubernetes>=36,<37",
]

[project.optional-dependencies]
# Clasificador real de prompt injection (solo laptop: descarga ~750 MB, usa torch).
classifier = ["transformers>=4.40,<5", "torch>=2.2,<3", "sentencepiece>=0.2"]

[project.scripts]
blue-reviewer = "devsecops_agents.blue_reviewer.__main__:main"
red-attacker = "devsecops_agents.red_attacker.__main__:main"
approval-agent = "devsecops_agents.approval_agent.__main__:main"
run-duel = "devsecops_agents.duel.__main__:main"
remediation-agent = "devsecops_agents.remediation_agent.__main__:main"
remediation-request = "devsecops_agents.remediation_agent.request:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devsecops_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts y tokens ficticios de prueba.
"tests/**" = ["S101", "S105", "S106"]
