# Application de Argo CD que despliega el PIPELINE del duelo (propuesta 2):
# pipeline Tekton de 8 etapas + supply chain + sample-app. Kyverno (admission)
# se gestiona por su propia Application (application-kyverno.yaml) porque sus
# ClusterPolicy son cluster-scoped.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duel-pipeline
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: black-alpaca-2026
    black-alpaca.session: "2-duel"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: duel-devsecops
  source:
    # AJUSTAR al publicar el repo de la charla.
    repoURL: https://github.com/jeanpaul-lopez/black-alpaca-redteam-agentes-k8s.git
    targetRevision: main
    path: session-2-duel/03-gitops/pipeline
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-duel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
