# ClusterPolicy Kyverno — verifyImages con la clave publica cosign del duelo.
#
# ANGULO "la firma NO ayuda pero la policy SI": esta policy exige que las
# imagenes del namespace openclaw-duel esten FIRMADAS con la clave del duelo. Pero
# el PR envenenado modifica CONFIG/documentacion (config/deploy-notes.md), NO el
# codigo de la imagen: la imagen se construye, firma y verifica CORRECTAMENTE. La
# firma es VALIDA y NO detecta el ataque. La supply chain de la imagen esta intacta;
# el ataque va por otro canal (prompt injection en el config que revisa el agente).
# => La firma es NECESARIA pero NO SUFICIENTE. Lo que atrapa el ataque es la otra
#    policy (policy-require-human-approval.yaml), no esta.
#
# Enforce: la imagen propia vive en el registry interno Zot y el pipeline la firma
# por digest (etapa sign). Kyverno verifica esa firma en admision con la clave
# publica del duelo; la imagen base publica no matchea imageReferences.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: duel-verify-images
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.component: duel
  annotations:
    policies.kyverno.io/title: Verificar firma cosign de imagenes
    policies.kyverno.io/category: Supply Chain / Image Signing
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Exige que las imagenes propias de openclaw-duel (registry Zot) esten
      firmadas con la clave cosign del duelo. El PR envenenado NO toca la imagen,
      asi que la firma es valida y NO frena el ataque (lo frena la policy de
      aprobacion humana).
spec:
  # ENFORCE: ahora SI hay registry interno (Zot) con imagenes firmadas por cosign,
  # asi que la verificacion de firma en admision es REAL y bloqueante. OJO (charla):
  # esto NO frena el ataque del duelo — el PR envenenado no toca la imagen, asi que
  # la imagen esta firmada y verifica OK -> Kyverno la ADMITE. Es defensa en capas
  # real, pero la capa que atrapa el ataque es la OTRA policy (require-human-approval).
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - openclaw-duel
      verifyImages:
        # Imagenes del registry interno Zot. La imagen base publica (ubi9/nginx) NO
        # matchea este patron -> no se le exige firma (no la firmamos nosotros).
        # Solo se exige firma a la imagen propia construida y firmada por el pipeline.
        - imageReferences:
            - "zot.registry.svc.cluster.local:5000/openclaw-duel/*"
          # NOTA: el registry es HTTP interno. En Kyverno 1.13 el acceso a un
          # registry inseguro NO se configura por policy (no existe
          # allowInsecureRegistry en verifyImages), sino a NIVEL GLOBAL del
          # admission-controller con el flag --allowInsecureRegistry=true. Ver
          # README.md de kyverno/ para el patch del deployment de Kyverno.
          attestors:
            - count: 1
              entries:
                - keys:
                    # LA MISMA clave publica cosign que el pipeline usa para firmar
                    # (Secret duel-cosign-keys, ver README del pipeline). Si regeneras el par,
                    # reemplaza aqui la clave publica.
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEQ36bIy2aWuOWi+jvUB/UimSqHnnm
                      AUdXJsEeH7ZIidBkRRcwQGA9KAJ9mahkbtT9y/qEmc7GfQTLyvm3ALMouQ==
                      -----END PUBLIC KEY-----
