# ServiceAccount del runner del duelo — SIN permisos de merge/deploy.
# Frontera del Acto 4 (separacion de credenciales + human-in-the-loop): el
# agente azul corre bajo esta identidad, que NO tiene RBAC para mergear PRs ni
# para sincronizar Argo CD (ns argocd). Aunque el azul "apruebe", el merge real
# exige un humano con otra credencial. No se le crea ningun RoleBinding a proposito.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: duel-runner
  namespace: openclaw-duel
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.component: duel
# automountServiceAccountToken:false — el runner no necesita hablar con el API
# server (misma frontera k8s-api del contrato, ../../../shared/lab-conventions.md). Llegar al
# LLM local (vLLM) es trafico de POD a un ClusterIP interno, no al API server:
# no requiere token montado.
automountServiceAccountToken: false
