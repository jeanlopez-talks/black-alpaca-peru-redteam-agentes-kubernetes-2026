# Kustomize del agente DevSecOps (human-in-the-loop). Se incluye como componente
# del kustomize raiz de Backstage (../kustomization.yaml).
#
# NOTA: el ConfigMap `backstage-agent-src` (codigo del agente) NO se genera aqui
# a proposito (load-restrictor: el codigo vive en ../../../04-lab/backstage-agent/, fuera de
# este dir). Lo crea el operador en el deploy con el comando documentado en el
# README. Por eso el Deployment lo referencia por nombre fijo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backstage

resources:
  - serviceaccount.yaml
  - secret-human-token.yaml
  - deployment.yaml
