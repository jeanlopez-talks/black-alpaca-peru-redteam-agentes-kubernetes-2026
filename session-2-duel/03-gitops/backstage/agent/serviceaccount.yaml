# ServiceAccount del agente DevSecOps — SOLO LECTURA (Tekton + Argo CD).
#
# El agente LEE el estado del pipeline (PipelineRun/TaskRun) y de Argo CD
# (Application) para resumirlo. NO tiene RBAC de escritura a proposito: aunque el
# codigo intentara actuar, el API server lo rechazaria. La accion real
# (poner la anotacion humana, re-run) la hace un HUMANO/operador con sus
# credenciales. Misma frontera de separacion de credenciales que duel-runner.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-devsecops-agent
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.component: backstage-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-devsecops-agent-read
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.component: backstage-agent
rules:
  # Tekton: leer los PipelineRun/TaskRun del duelo para resumir las etapas.
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, taskruns]
    verbs: [get, list, watch]
  # Argo CD: leer las Application para su sync/health.
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-devsecops-agent-read
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.component: backstage-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-devsecops-agent-read
subjects:
  - kind: ServiceAccount
    name: backstage-devsecops-agent
    namespace: backstage
