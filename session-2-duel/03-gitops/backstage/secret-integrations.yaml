# Secret con los tokens que Backstage usa para hablar con Argo CD y el API de
# K8s. TODOS los valores aqui son PLACEHOLDERS DE DEMO (no son secretos reales).
#
# SEGURIDAD (regla del repo): nunca hardcodear secretos reales en git. En el
# cluster del homelab hay external-secrets; lo PRODUCTIVO seria un ExternalSecret
# que lea de un vault. Para la demo dejamos un Secret con placeholders claros y
# un comentario de AJUSTAR. Si usas valores reales, copia este archivo a
# `secret-integrations-secret.local.yaml` (patron ya ignorado por .gitignore:
# `*-secret.local.yaml`), pon ahi los tokens reales y aplica ESE, no el versionado.
#
# COMO OBTENER LOS TOKENS (documentado para el operador):
#   - ARGOCD_AUTH_TOKEN: `argocd account generate-token` (cuenta de solo lectura).
#   - K8S_SA_TOKEN: token de un ServiceAccount de solo lectura (ver rbac.yaml).
#   - BACKEND_SECRET: cadena aleatoria para firmar sesiones (openssl rand -hex 32).
apiVersion: v1
kind: Secret
metadata:
  name: backstage-integrations
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.component: backstage
type: Opaque
stringData:
  # AJUSTAR: clave aleatoria para firmar sesiones de Backstage.
  BACKEND_SECRET: "CHANGE-ME-demo-backend-secret"
  # AJUSTAR: credenciales/token de una cuenta de SOLO LECTURA de Argo CD.
  ARGOCD_USER: "admin"
  ARGOCD_PASSWORD: "CHANGE-ME-argocd-readonly"
  ARGOCD_AUTH_TOKEN: "CHANGE-ME-argocd-api-token"
  # AJUSTAR: token del ServiceAccount de solo lectura del cluster (ver rbac.yaml).
  K8S_SA_TOKEN: "CHANGE-ME-k8s-readonly-sa-token"
