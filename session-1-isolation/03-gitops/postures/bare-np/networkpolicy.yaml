# Postura `bare-np` — NetworkPolicy: egress deny-by-default salvo DNS.
# Es la ÚNICA frontera que distingue a `bare-np` de `bare`.
# Patrón: una policy que selecciona TODOS los pods del namespace y niega todo
# el egress, y una segunda policy que reabre SOLO el DNS (UDP/TCP 53) para que
# la resolución de nombres del clúster siga funcionando.
# Esto prueba si la NetworkPolicy por sí sola contiene la exfiltración de red
# (p. ej. el intento de alcanzar el API server o un endpoint externo).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: openclaw-bare-np
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.posture: bare-np
spec:
  podSelector: {}
  policyTypes:
    - Egress
  # Sin reglas de egress => se niega TODO el tráfico de salida.
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: openclaw-bare-np
  labels:
    app.kubernetes.io/part-of: redteam-agents
    redteam.posture: bare-np
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Única excepción: resolución DNS (UDP y TCP puerto 53).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
